<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkTracker - Track and Visualise Work Hours</title>
    <meta name="description" content="Manage and track work hours across projects using custom local storage caching and Firebase Google Authentication.">
  </head>
  <body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg custom-navbar">
      <div class="container px-4">
        <a class="navbar-brand d-flex align-items-center gap-2" id="navHomeBrand" href="#">
          <i class="bi bi-clock-fill text-primary fs-4"></i>
          <span>WorkTracker</span>
        </a>
        <div id="authContainer" class="ms-auto">
          <!-- Auth details and button injected here dynamically -->
        </div>
      </div>
    </nav>

    <!-- Global Error Banner -->
    <div class="container px-4 mt-3">
      <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
    </div>

    <!-- Syncing Screen (Loader) -->
    <div id="loaderSection" class="container d-flex flex-column align-items-center justify-content-center py-5 my-5">
      <div class="spinner-border text-primary sync-spinner" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="text-secondary mt-3">Syncing session data...</p>
    </div>

    <!-- Dashboard Main Area -->
    <main id="mainContentSection" class="container px-4 py-4 d-none">

      <!-- Greeting and Filter scope summary -->
      <div class="d-flex align-items-baseline gap-2 mb-4">
        <h1 class="h3 fw-bold text-white mb-0">Dashboard</h1>
        <span id="filterScopeText" class="badge bg-primary-subtle text-primary rounded-pill">This Month</span>
      </div>

      <!-- Quick Metrics Grid -->
      <div class="row g-4 mb-4">
        <!-- Card 1: Time Logged -->
        <div class="col-md-4">
          <div class="glass-card h-100 p-4 d-flex align-items-center justify-content-between" id="metricHoursCard">
            <div>
              <span class="text-secondary small d-block mb-1">Time Logged</span>
              <h2 id="statsHoursVal" class="h2 fw-bold text-white mb-0">0s</h2>
            </div>
            <div class="stat-icon primary">
              <i class="bi bi-hourglass-split"></i>
            </div>
          </div>
        </div>

        <!-- Card 2: Active Projects Count -->
        <div class="col-md-4">
          <div class="glass-card h-100 p-4 d-flex align-items-center justify-content-between" id="metricProjectsCard">
            <div>
              <span class="text-secondary small d-block mb-1">Active Projects</span>
              <h2 id="statsProjectsVal" class="h2 fw-bold text-white mb-0">0</h2>
            </div>
            <div class="stat-icon success">
              <i class="bi bi-folder-check"></i>
            </div>
          </div>
        </div>

        <!-- Card 3: Total Logs Session Count -->
        <div class="col-md-4">
          <div class="glass-card h-100 p-4 d-flex align-items-center justify-content-between" id="metricLogsCard">
            <div>
              <span class="text-secondary small d-block mb-1">Recorded Logs</span>
              <h2 id="statsLogsVal" class="h2 fw-bold text-white mb-0">0</h2>
            </div>
            <div class="stat-icon warning">
              <i class="bi bi-journal-text"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Layout Columns -->
      <div class="row g-4">

        <!-- Left Column: Timer Control Card and Chart Visualization -->
        <div class="col-lg-5">
          <!-- Active Timer Container -->
          <div id="trackingCard" class="glass-card mb-4 overflow-hidden">
            <!-- Timer interfaces will be loaded dynamically here -->
          </div>

          <!-- Dynamic Doughnut Chart -->
          <div class="glass-card p-4" id="projectBreakdownCard">
            <h5 class="h6 text-white mb-3">Project breakdown (Hours)</h5>
            <div class="chart-container">
              <canvas id="projectChart" style="display: none;"></canvas>
              <!-- Empty state placeholder -->
              <div id="chartPlaceholder" class="h-100 w-100 d-flex flex-column align-items-center justify-content-center text-center">
                <i class="bi bi-pie-chart text-secondary display-6 mb-2"></i>
                <p class="text-secondary small mb-0">No project data to chart.</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column: Filter actions and Time Log History scrollable list -->
        <div class="col-lg-7">
          <div class="glass-card p-4 h-100 d-flex flex-column" id="trackingHistoryCard">
            <h5 class="h6 text-white mb-4">Tracking History</h5>

            <!-- Filters Header Row -->
            <div class="row g-2 mb-3">
              <!-- Fulltext search input -->
              <div class="col-md-6">
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-secondary search-icon-container">
                    <i class="bi bi-search"></i>
                  </span>
                  <input 
                    type="text" 
                    id="historySearchInput" 
                    class="form-control form-control-custom search-input-field" 
                    placeholder="Search logs..." 
                  >
                </div>
              </div>

              <!-- Month filter select -->
              <div class="col-sm-6 col-md-3">
                <select id="monthFilterSelect" class="form-select form-control-custom">
                  <option value="current">Current Month</option>
                  <option value="all">All Months</option>
                </select>
              </div>

              <!-- Project filter select -->
              <div class="col-sm-6 col-md-3">
                <select id="projectFilterSelect" class="form-select form-control-custom">
                  <option value="all">All Projects</option>
                </select>
              </div>
            </div>

            <!-- List Container (Scrollable) -->
            <div class="flex-grow-1 overflow-y-auto logs-list-scroll" id="logsListContainer">
              <!-- Time logs items dynamically loaded -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Custom Resume Task Description Modal -->
    <div class="modal fade" id="resumeDescriptionModal" tabindex="-1" aria-labelledby="resumeDescriptionModalLabel">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card p-2">
          <div class="modal-header border-0 pb-0">
            <h5 class="modal-title text-white fw-bold" id="resumeDescriptionModalLabel">Resume Tracking</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <form id="resumeModalForm">
            <div class="modal-body py-3">
              <p class="text-secondary small mb-3">What are you working on in this session?</p>
              <div class="mb-3">
                <label for="modalProjectNameInput" class="form-label text-secondary small mb-1">Project</label>
                <input type="text" id="modalProjectNameInput" class="form-control form-control-custom" readonly disabled>
              </div>
              <div>
                <label for="modalDescriptionInput" class="form-label text-secondary small mb-1">Session Description</label>
                <textarea id="modalDescriptionInput" class="form-control form-control-custom" rows="3" placeholder="Describe the task..."></textarea>
              </div>
            </div>
            <div class="modal-footer border-0 pt-0 gap-2">
              <button type="button" class="btn btn-secondary-custom btn-sm py-2 px-3" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary-custom btn-sm py-2 px-4">Start Timer</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Main JavaScript application bundle -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
